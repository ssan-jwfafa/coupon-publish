<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Order Lifecycle Flow</title>
  <desc id="desc">주문 생성과 상태 변경이 Redis 저장소, outbox, Kafka, Flink를 거쳐 주문 집계로 이어지는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 34px Arial, sans-serif;fill:#111827}
      .sub{font:400 16px Arial, sans-serif;fill:#4b5563}
      .step{font:700 18px Arial, sans-serif;fill:#111827}
      .small{font:400 13px Arial, sans-serif;fill:#4b5563}
      .lane{font:700 16px Arial, sans-serif;fill:#334155}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:8}
      .api{fill:#e0f2fe;stroke:#0284c7}
      .redis{fill:#dcfce7;stroke:#16a34a}
      .mysql{fill:#fee2e2;stroke:#dc2626}
      .kafka{fill:#fef3c7;stroke:#d97706}
      .flink{fill:#ede9fe;stroke:#7c3aed}
      .line{stroke:#374151;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="60" y="62">주문 관리 Flow</text>
  <text class="sub" x="60" y="94">주문 원본과 이벤트 로그는 Redis에 빠르게 저장하고, 상태별 수량과 매출 집계는 스트림 처리로 갱신합니다.</text>

  <text class="lane" x="70" y="150">Command Path</text>
  <rect class="box api" x="60" y="170" width="190" height="96"/>
  <text class="step" x="88" y="207">Client</text>
  <text class="small" x="88" y="232">POST /api/orders</text>
  <text class="small" x="88" y="252">PATCH /api/orders/{id}/status</text>

  <rect class="box api" x="305" y="170" width="205" height="96"/>
  <text class="step" x="333" y="207">OrderController</text>
  <text class="small" x="333" y="232">주문 요청 검증</text>

  <rect class="box api" x="565" y="170" width="205" height="96"/>
  <text class="step" x="593" y="207">OrderService</text>
  <text class="small" x="593" y="232">생성, 상태 변경</text>
  <text class="small" x="593" y="252">이벤트 발행 요청</text>

  <rect class="box redis" x="825" y="150" width="280" height="136"/>
  <text class="step" x="853" y="190">Redis Order Store</text>
  <text class="small" x="853" y="216">order:{orderId}</text>
  <text class="small" x="853" y="238">order:index</text>
  <text class="small" x="853" y="260">order:events</text>

  <path class="line" d="M250 218 H305"/>
  <path class="line" d="M510 218 H565"/>
  <path class="line" d="M770 218 H825"/>

  <text class="lane" x="70" y="360">Analytics Path</text>
  <rect class="box mysql" x="120" y="382" width="220" height="105"/>
  <text class="step" x="148" y="420">MySQL Outbox</text>
  <text class="small" x="148" y="446">outbox_events</text>
  <text class="small" x="148" y="468">topic = order-events</text>

  <rect class="box api" x="405" y="382" width="190" height="105"/>
  <text class="step" x="433" y="420">OutboxRelay</text>
  <text class="small" x="433" y="446">PENDING/FAILED 조회</text>
  <text class="small" x="433" y="468">Kafka 발행 후 PUBLISHED</text>

  <rect class="box kafka" x="660" y="382" width="165" height="105"/>
  <text class="step" x="688" y="420">Kafka</text>
  <text class="small" x="688" y="446">order-events</text>

  <rect class="box flink" x="890" y="382" width="185" height="105"/>
  <text class="step" x="918" y="420">Flink Job</text>
  <text class="small" x="918" y="446">OrderStatistics</text>
  <text class="small" x="918" y="468">중복 이벤트 방지</text>

  <rect class="box redis" x="720" y="545" width="350" height="78"/>
  <text class="step" x="748" y="578">Redis Read Model</text>
  <text class="small" x="748" y="602">summary, recent-events, events dedup</text>

  <path class="dash" d="M670 286 V328 H230 V382"/>
  <path class="line" d="M340 435 H405"/>
  <path class="line" d="M595 435 H660"/>
  <path class="line" d="M825 435 H890"/>
  <path class="line" d="M982 487 V545"/>
</svg>
