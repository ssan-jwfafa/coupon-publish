plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Coupon publish project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.apache.flink:flink-streaming-java:1.20.1'
	implementation 'org.apache.flink:flink-clients:1.20.1'
	implementation 'org.apache.flink:flink-connector-base:1.20.1'
	implementation 'org.apache.flink:flink-connector-kafka:3.3.0-1.20'
	implementation 'redis.clients:jedis:5.2.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:deprecation']
}

tasks.register('runCouponStatisticsFlinkJob', JavaExec) {
	group = 'application'
	description = 'Runs the coupon-issued Kafka to Redis statistics Flink job.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.couponpublish.coupon.flink.CouponStatisticsFlinkJob'
	systemProperties System.getProperties().findAll { key, value ->
		key.toString().startsWith('coupon.flink.')
	}
}

tasks.register('runOrderStatisticsFlinkJob', JavaExec) {
	group = 'application'
	description = 'Runs the order-events Kafka to Redis statistics Flink job.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.couponpublish.order.flink.OrderStatisticsFlinkJob'
	systemProperties System.getProperties().findAll { key, value ->
		key.toString().startsWith('order.flink.')
	}
}
