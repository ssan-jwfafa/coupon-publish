spring:
  application:
    name: coupon-publish
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:mysql://localhost:3306/coupon_publish?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: coupon
    password: coupon
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 3000
    consumer:
      group-id: coupon-publish
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.couponpublish.coupon.event,com.example.couponpublish.order.event

coupon:
  kafka:
    enabled: true
    topics:
      coupon-issued: coupon-issued

order:
  kafka:
    enabled: true
    topics:
      events: order-events

outbox:
  relay:
    enabled: true
    batch-size: 50
    max-attempts: 10
    fixed-delay: 1000
