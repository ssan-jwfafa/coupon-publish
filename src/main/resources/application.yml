spring:
  application:
    name: coupon-publish
  datasource:
    url: jdbc:mysql://localhost:3306/coupon_publish?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: coupon
    password: coupon
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

coupon:
  max-count: 100
