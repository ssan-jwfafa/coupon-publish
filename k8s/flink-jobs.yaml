apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon-statistics-flink
  namespace: coupon-publish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coupon-statistics-flink
  template:
    metadata:
      labels:
        app: coupon-statistics-flink
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do echo waiting for redis; sleep 2; done
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: flink-job
          image: coupon-publish:local
          imagePullPolicy: Never
          command:
            - ./gradlew
          args:
            - --no-daemon
            - -Dcoupon.flink.kafka.bootstrap-servers=kafka:9092
            - -Dcoupon.flink.redis.host=redis
            - -Dcoupon.flink.redis.port=6379
            - runCouponStatisticsFlinkJob
---
