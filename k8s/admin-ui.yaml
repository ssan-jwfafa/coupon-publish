apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: coupon-publish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: coupon-publish
spec:
  type: LoadBalancer
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8081
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-ui
  namespace: coupon-publish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-ui
  template:
    metadata:
      labels:
        app: redis-ui
    spec:
      containers:
        - name: redis-ui
          image: rediscommander/redis-commander:latest
          ports:
            - containerPort: 8081
          env:
            - name: REDIS_HOSTS
              value: local:redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-ui
  namespace: coupon-publish
spec:
  type: LoadBalancer
  selector:
    app: redis-ui
  ports:
    - name: http
      port: 8082
      targetPort: 8081
