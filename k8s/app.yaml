apiVersion: apps/v1
kind: Deployment
metadata:
  name: coupon-publish-api
  namespace: coupon-publish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coupon-publish-api
  template:
    metadata:
      labels:
        app: coupon-publish-api
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done
              until nc -z redis 6379; do echo waiting for redis; sleep 2; done
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: api
          image: coupon-publish:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/coupon_publish?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
            - name: SPRING_DATASOURCE_USERNAME
              value: coupon
            - name: SPRING_DATASOURCE_PASSWORD
              value: coupon
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: coupon-publish-api
  namespace: coupon-publish
spec:
  type: LoadBalancer
  selector:
    app: coupon-publish-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
